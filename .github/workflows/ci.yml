name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
# Each job grants itself only what it needs: read access to the repository at most.
permissions: {}
# A new push to a pull request cancels the run of its previous commit. Every other run, including
# the call from the publish workflow, gets a group of its own and is never cancelled or queued.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Job ids are the check names, and the ruleset on main requires `application`: no `name:` keys.
#
# The repository variable CI_RUNNER selects a self-hosted runner label for this repository's own
# branches. Pull requests from forks always run on GitHub-hosted runners: their code must never
# run on a self-hosted machine.
jobs:
  backend:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv also installs Python. Keep both in step with the uv and python images in the Dockerfile.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14"
      - name: uv.lock resolves from PyPI only
        run: |
          if grep -oE 'https?://[^/"]+' uv.lock | sort -u | grep -vxE 'https://(pypi\.org|files\.pythonhosted\.org)'; then
            echo "::error file=uv.lock::Lock the dependencies against PyPI (https://pypi.org/simple), not a mirror"
            exit 1
          fi
      # The integration tests compare the four engines: ncdu and gdu as the image installs them, and
      # GNU du (`gnudu` where the system du is another implementation).
      - name: Install the scan engines
        run: |
          scripts/install-engines.sh "$RUNNER_TEMP/engines"
          echo "$RUNNER_TEMP/engines" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - name: Run the backend tests
        run: uv run --no-sync pytest -q --durations=15 --junitxml="$RUNNER_TEMP/pytest.xml"
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/export_openapi.py --check
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: ${{ runner.temp }}/pytest.xml
          if-no-files-found: ignore
  frontend:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python runs the synthetic server of the browser tests (scripts/smoke_server.py).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14"
      # Keep Node in step with the node image in the Dockerfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm writes the registry it installed from into the lockfile: keep it the public one.
      - name: package-lock.json resolves from registry.npmjs.org only
        working-directory: frontend
        run: |
          if grep -E '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error file=frontend/package-lock.json::Every \"resolved\" URL must start with https://registry.npmjs.org/"
            exit 1
          fi
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run gen:api -- --check && npm run lint && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the browser tests of the application
        run: npm run e2e -- --reporter=line
        working-directory: frontend
      # The static public demo (src/demo/): built and tested in Chromium, with no backend.
      - run: npm run build:demo
        working-directory: frontend
      - name: Run the browser tests of the demo
        run: npm run e2e:demo -- --reporter=line
        working-directory: frontend
      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
  docker:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the actual production image
        run: docker build --build-arg IMAGE_TAG=ci -t drdonoso/disksprawl:ci .
      - name: Smoke-test it with Compose and a sample tree
        run: scripts/docker_smoke.sh
        env:
          IMAGE_TAG: ci
          COMPOSE_PROJECT_NAME: disksprawl-ci
  application:
    needs: [backend, frontend, docker]
    # always(): a failed, cancelled or skipped job fails this required check instead of skipping it
    # (a skipped check counts as passed). Runs cancelled by a newer push therefore end red too.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DOCKER_RESULT" = success
