name: Build and publish Docker image
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - .github/CODEOWNERS
      - .github/dependabot.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: disksprawl-release
  cancel-in-progress: false
jobs:
  validate:
    # A reusable workflow called with `./` is resolved from the running commit, with no checkout.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: validate
    # Forks build and test like upstream, but only this repository publishes the image.
    if: github.ref == 'refs/heads/main' && github.repository == 'DrDonoso/disksprawl'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    env:
      IMAGE: drdonoso/disksprawl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, for the CalVer sequence
          persist-credentials: false
      # arm64 (a Raspberry Pi, an ARM NAS or mini PC) is built under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # A version is free when neither a git tag nor an image tag has it: published images are
      # never overwritten.
      - name: Compute serialized CalVer
        id: version
        shell: bash
        run: |
          set -euo pipefail
          image_exists() { # image_exists <tag>
            local output
            if output=$(docker buildx imagetools inspect "$IMAGE:$1" 2>&1); then return 0; fi
            if grep -q 'not found' <<<"$output"; then return 1; fi
            echo "::error::Could not check whether $IMAGE:$1 exists: $output"
            exit 1
          }
          day=$(date -u +%Y%m%d)
          version="$day"
          number=2
          while git rev-parse --verify --quiet "refs/tags/$version" >/dev/null || image_exists "$version"; do
            version=$(printf '%s.%02d' "$day" "$number")
            number=$((number + 1))
          done
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # No layer cache: the image is built from scratch, so nothing another job wrote to the shared
      # Actions cache can end up in the published image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ steps.version.outputs.date }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes="$RUNNER_TEMP/whats-new.md"
          : > "$notes"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            python3 scripts/release_notes.py "$previous" "$GITHUB_SHA" > "$notes" \
              || { echo "::warning::Could not build the What's new notes"; : > "$notes"; }
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file "$notes" --generate-notes
