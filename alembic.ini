# `alembic upgrade head` from the repository root migrates the database in DATA_DIR (./data by
# default). The application also migrates on every start.
[alembic]
script_location = disksprawl:migrations
prepend_sys_path = src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
